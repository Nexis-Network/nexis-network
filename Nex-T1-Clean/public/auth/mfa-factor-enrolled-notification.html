<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html dir="ltr" lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preload" as="image" href="https://nex-t1.ai/logo/nexis-logo-full-light.svg" />
  </head>
  <body style="margin:0;padding:0;background:#000;color:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen-Sans,Ubuntu,Cantarell,'Helvetica Neue',sans-serif">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation" align="center" style="background:#000">
      <tbody>
        <tr>
          <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" role="presentation" style="width:600px;max-width:600px;background:#000;color:#fff">
              <tbody>
                <tr>
                  <td align="center" style="padding:40px 16px">
                    <img src="https://nex-t1.ai/logo/nexis-logo-full-light.svg" alt="Nexis" height="24" style="display:block;border:0;outline:none;height:24px;width:auto" />
                  </td>
                </tr>
                <tr>
                  <td align="center" style="font-size:26px;font-weight:700;padding:0 24px">MFA factor enrolled</td>
                </tr>
                <tr><td height="16" style="line-height:16px;font-size:0">&nbsp;</td></tr>
                <tr>
                  <td align="center" style="padding:0 30px;font-size:15px;line-height:1.6;color:#e5e7eb">
                    A new multi-factor authentication method ({{ .FactorType }}) was enrolled for {{ .Email }}.
                  </td>
                </tr>
                <tr><td height="20" style="line-height:20px;font-size:0">&nbsp;</td></tr>
                <tr>
                  <td align="center" style="padding:0 30px;font-size:14px;line-height:1.6;color:#9ca3af">

                  </td>
                </tr>
                <tr><td height="24" style="line-height:24px;font-size:0">&nbsp;</td></tr>
                <tr><td style="height:1px;background:#303234;font-size:0;line-height:0">&nbsp;</td></tr>
                <tr><td height="16" style="line-height:16px;font-size:0">&nbsp;</td></tr>
                <tr>
                  <td align="center" style="font-size:13px;line-height:16px">
                    <a href="https://nex-t1.ai" style="color:#fff;text-decoration:underline">Home</a>
                    <span style="color:#303234;padding:0 6px;">•</span>
                    <a href="https://nexis.network/privacy" style="color:#fff;text-decoration:underline">Privacy</a>
                  </td>
                </tr>
                <tr><td height="16" style="line-height:16px;font-size:0">&nbsp;</td></tr>
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
